# Cấu hình deploy lên Render (render.com) – gói Free, đặt máy chủ ở Singapore.
# Hiện dùng để THỬ xem ĐMX có cho máy chủ Singapore gọi API không: mở <link>/diag/dmx.
# Lưu ý: gói Free không giữ file khi server ngủ/khởi động lại → DB tạm thời (sẽ chuyển sang Turso nếu thử thành công).
services:
  - type: web
    name: elmich-monitor
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: DB_PATH
        value: /tmp/market.db
      - key: CRAWL_ON_SCHEDULE
        value: 'false'
      - key: AUTH_USER
        sync: false
      - key: AUTH_PASSWORD
        sync: false
