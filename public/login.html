<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập – Theo dõi giá Điện Máy Xanh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-page">
    <main class="login-card">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <p class="brand-name">Theo dõi giá Điện Máy Xanh</p>
          <p class="brand-sub">Công cụ nội bộ</p>
        </div>
      </div>

      <h1 class="login-title">Đăng nhập</h1>

      <form id="login-form" class="login-form" novalidate>
        <label class="login-field">
          <span>Tên đăng nhập</span>
          <input id="user" name="user" type="text" autocomplete="username" autocapitalize="none" required autofocus />
        </label>
        <label class="login-field">
          <span>Mật khẩu</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <p id="login-msg" class="msg" aria-live="polite"></p>
        <button id="login-btn" class="btn btn-primary btn-block" type="submit">
          <span class="btn-text">Đăng nhập</span>
        </button>
      </form>

      <p class="note">Phiên đăng nhập có hiệu lực đến hết ngày hôm nay. Sang ngày mới cần đăng nhập lại.</p>
    </main>
    <script src="login.js"></script>
  </body>
</html>
